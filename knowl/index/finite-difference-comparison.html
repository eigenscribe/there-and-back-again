<section class="paragraphs"><h2 class="heading"><span class="title">Comparison of Finite Difference Scheme Properties.</span></h2>
<div class="para">The following tables summarize common finite difference schemes for first and second derivatives.<div class="autopermalink" data-description="Paragraph"><a href="#finite-difference-comparison-5" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>

</div>
<div class="para logical">
<div class="displaymath process-math">
\begin{equation*}
\frac{df}{dx} \approx \frac{f(x+\Delta x) - f(x)}{\Delta x}
\end{equation*}
</div>
<div class="autopermalink" data-description="Paragraph"><a href="#tab-first-derivative-finite-difference-2-5-1-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
</td>
<td class="l m b1 r1 l0 t0 lines"><span class="process-math">\(\mathcal{O}(\Delta x)\)</span></td>
<td class="l m b1 r1 l0 t0 lines"><span class="process-math">\(1\)</span></td>
</tr>
<tr>
<td class="l m b1 r1 l1 t0" style="max-width:300px;">
<div class="para">
<dfn class="terminology">Backward Difference</dfn><div class="autopermalink" data-description="Paragraph"><a href="#tab-first-derivative-finite-difference-2-6-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="para logical">
<div class="displaymath process-math">
\begin{equation*}
\frac{df}{dx} \approx \frac{f(x) - f(x-\Delta x)}{\Delta x}
\end{equation*}
</div>
<div class="autopermalink" data-description="Paragraph"><a href="#tab-first-derivative-finite-difference-2-6-1-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
</td>
<td class="l m b1 r1 l0 t0 lines"><span class="process-math">\(\mathcal{O}(\Delta x)\)</span></td>
<td class="l m b1 r1 l0 t0 lines"><span class="process-math">\(1\)</span></td>
</tr>
<tr>
<td class="l m b1 r1 l1 t0" style="max-width:300px;">
<div class="para">
<dfn class="terminology">Central Difference</dfn><div class="autopermalink" data-description="Paragraph"><a href="#tab-first-derivative-finite-difference-2-7-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>

<div class="para">Second-order accurate central difference scheme:</div>

\end{equation*}
</div>
<div class="autopermalink" data-description="Paragraph"><a href="#tab-first-derivative-finite-difference-2-7-1-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
</td>

</table></div>
