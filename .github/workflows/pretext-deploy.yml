name: Build and Deploy (Manual/gh-pages)
on:
  # Currently, this workflow only runs when manually selected (the `workflow_dispatch` event).
  # If you would like it to run on other events, uncomment some of the lines below.

  # # Runs on pull requests
  # pull_request:
  #     branches: ["*"]

  # Runs on pushes to main
  push:
      branches: ["main"]

  # # Runs every day at 00:00 UTC
  # schedule:
  #     - cron: '0 0 * * *'

  # Runs on demand
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    container: oscarlevin/pretext-full

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: set up node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: add gh-cli
        run: |
          apt-get update
          apt-get install gh jq -y

      - name: setup git config
        run: |
          git config --global --add safe.directory $(pwd)
          git config user.name "${{ github.actor }} via GitHub Actions"
          git config user.email "${{ github.actor }}@github_actions.no_reply"

      - name: install deps
        run: pip install -r requirements.txt --break-system-packages --no-cache-dir

      - name: install local ptx files
        run: pretext --version

      - name: Build and post-process
        run: |
          chmod +x build.sh
          ./build.sh

      - name: stage deployment
        run: |
          # Use output from build.sh and stage it for deployment
          mkdir -p output/stage
          cp -r output/web/* output/stage/
          touch output/stage/.nojekyll

      - name: push gh-pages branch
        run: |
          # We need to ensure we are on a branch that can push to gh-pages
          # or use a more robust way to update the branch.
          # PreTeXt deploy --no-push usually handles staging in a way that
          # might be expected by subsequent steps, but we'll manually
          # manage the gh-pages branch to be sure build.sh results are used.
          git fetch origin gh-pages || true
          git checkout -B gh-pages
          rm -rf ./*
          cp -r output/stage/* ./
          git add -A
          git commit -m "Deploy recent changes to assets and source [skip ci]" || echo "No changes to commit"
          git push origin gh-pages --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
